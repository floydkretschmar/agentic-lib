[features]
multi_agent = true
hooks = true

[agents.architect-agent]
config_file = "./agents/architect-agent.toml"
[agents.codebase-researcher-agent]
config_file = "./agents/codebase-researcher-agent.toml"
[agents.qa-agent]
config_file = "./agents/qa-agent.toml"
[agents.review-agent]
config_file = "./agents/review-agent.toml"
[agents.web-researcher-agent]
config_file = "./agents/web-researcher-agent.toml"

[[hooks.PreToolUse]]
matcher = "*"
displayName = "Tool safety hook"
description = "Blocks unsafe tool usage"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/run.sh" safety-hook'
timeout = 5
statusMessage = "Dangerous tool-use guard"

[[hooks.PreToolUse]]
matcher = "^Bash$"
displayName = "RTK rewrite"
description = "Rewrites supported Bash commands to their RTK equivalents."

[[hooks.PreToolUse.hooks]]
type = "command"
command = "rtk hook codex"
timeout = 5
statusMessage = "Rewriting command with RTK"
